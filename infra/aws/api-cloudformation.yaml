AWSTemplateFormatVersion: "2010-09-09"
Description: Pathfinder production API shell - HTTP API Gateway plus Lambda.

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]+$"
  ApiName:
    Type: String
    Default: vornan-pathfinder-api
  LambdaFunctionName:
    Type: String
    Default: vornan-pathfinder-api
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String
  AllowedOrigins:
    Type: String
    Default: "https://pathfinder.vornan.co,https://status.vornan.co"
  PublicStatusBaseUrl:
    Type: String
    Default: "https://status.vornan.co"
  PublicStatusTokenDays:
    Type: Number
    Default: 30
  PublicStatusReturnLink:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  PublicStatusEmailMode:
    Type: String
    Default: "log"
    AllowedValues:
      - log
      - ses
  PublicStatusEmailDebugReturnLink:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  PublicIntakeEmailVerificationEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Fail-closed server gate for one-time customer order dropbox email verification.
  WrikeConnectionTestEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Explicit operator-only gate for OAuth refresh plus the read-only Wrike current-user health check.
  WrikeCustomFieldDiscoveryEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Explicit operator-only gate for read-only Wrike account custom-field definition metadata.
  WrikeDiscoveryPreviewEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Explicit operator-only gate for one approved task read plus scoped attachment metadata without URLs or file content.
  WrikeWorkbookEvidenceEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Explicit operator-only gate for qualified Wrike workbook download into immutable source evidence storage.
  WrikeEvidencePreviewEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Independent operator-only gate for parsing verified stored evidence into a Pathfinder preview job.
  WrikeManualIntakeEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Explicit operator-only gate for capturing qualified Wrike workbooks and preparing separate Pathfinder preview jobs.
  WrikeScheduledIntakeEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Default-disabled 15-minute scheduler that discovers and prepares separate Wrike jobs.
  WrikeScheduledIntakeCustomerId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
  WrikeScheduledIntakeImportMethodId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
  WrikeScheduledIntakeMaxCandidates:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 25
  WrikeScheduledStatusWritebackEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Posts one replay-safe status-link comment after a scheduled Wrike job has a confirmed Lift order.
  WrikeScheduledLiftSubmitEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Allows the scheduled Wrike intake to submit each certified live-customer job exactly once with no automatic retry.
  WrikeStatusWritebackEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Bounded authenticated operator gate for posting one status comment to one exact Wrike task.
  WrikeStatusWritebackTaskId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9_-]{6,64}$"
  WrikeStatusWritebackExpiresAt:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"
  WrikeOrderRehearsalEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Expiring exact-customer, Import Method, and task gate for one authenticated non-submit Wrike order rehearsal.
  WrikeOrderRehearsalCustomerId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
  WrikeOrderRehearsalImportMethodId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
  WrikeOrderRehearsalTaskId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
  WrikeOrderRehearsalExpiresAt:
    Type: String
    Default: ""
    MaxLength: 40
  WrikeLiftDocumentPublicationEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Default-disabled gate for publishing verified Wrike evidence to the dedicated Lift delivery boundary.
  WrikeLiftDocumentDeliveryBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^vornan-pathfinder-wrike-delivery-[a-z0-9-]+$"
    Description: Dedicated outbound-only bucket from the Vornan asset-delivery stack.
  WrikeLiftDocumentDeliveryBaseUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://go\\.vornan\\.co$"
    Description: Exact direct-download origin. Keep empty while publication is dark.
  WrikeOAuthRedirectUri:
    Type: String
    Default: "https://api.pathfinder.vornan.co/oauth/wrike/callback"
    Description: Exact server-owned callback registered in the Wrike OAuth application.
  PathfinderAppBaseUrl:
    Type: String
    Default: "https://pathfinder.vornan.co"
    Description: Pathfinder admin app destination after the server completes or rejects Wrike authorization.
  EmailFrom:
    Type: String
    Default: "Vornan Updates <notifications@notify.vornan.co>"
  StatusReplyTo:
    Type: String
    Default: "support@vornan.co"
  ProofReplyTo:
    Type: String
    Default: "support@vornan.com"
  OrdersReplyTo:
    Type: String
    Default: "orders@vornan.co"
  SystemReplyTo:
    Type: String
    Default: "ops@vornan.co"
  SesRegion:
    Type: String
    Default: "us-east-1"
  SesConfigurationSet:
    Type: String
    Default: "pathfinder-transactional"
  PublicStatusRateLimitPepper:
    Type: String
    Default: ""
    NoEcho: true
  PublicStatusEmailMatchRequired:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  PublicStatusGlobalAllowedDomains:
    Type: String
    Default: "ltlco.com,vornan.co"
    Description: Comma-separated trusted domains allowed to request public status links across customers.
  RequireFirebaseAuth:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  AllowedEmailDomains:
    Type: String
    Default: "ltlco.com,vornan.co"
  FirebaseProjectId:
    Type: String
    Default: "ltl-dashboard-site"
  LiftCustomerListUrl:
    Type: String
    Default: "https://admin.lifterp.com/ords/lifterp/lift/erp/flush/ondemand/91/CustomerContactLIst/LTL-Customer-List?offset=0"
  LiftCustomerStatusUrl:
    Type: String
    Default: "https://ltlco.lifterp.com/ords/lifterp/lift/erp/flush/ondemand/91/CustomerStatusJSON/CustomerStatusJSON?"
  LiftProductCatalogBaseUrl:
    Type: String
    Default: "https://ltlco.lifterp.com/ords/api/lift/erp"
  ExternalLiftSubmitEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Server-level gate for certified Lift submit requests.
  LiftTransportMode:
    Type: String
    Default: dry_run
    AllowedValues:
      - dry_run
      - mock
      - live
    Description: Lift submit transport. Live performs the external POST after every other gate passes.
  AllowLiveCustomerSubmit:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Keep false for sandbox-profile submits through the production Lift endpoint.
  ApiDomainName:
    Type: String
    Default: ""
    Description: Optional custom API domain, such as api.pathfinder.vornan.co.
  ApiCertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN for ApiDomainName. Must be in the same region as this API Gateway HTTP API.
  DataTablePrefix:
    Type: String
    Default: Pathfinder
    AllowedPattern: "^[A-Za-z0-9-]+$"
    Description: Prefix used for Pathfinder DynamoDB table names.
  SecretPrefix:
    Type: String
    Default: "/vornan/pathfinder/"
    Description: Secrets Manager prefix Pathfinder may read and write.
  StorageDriver:
    Type: String
    Default: dynamodb
    AllowedValues:
      - local
      - dynamodb
    Description: Runtime storage driver for Pathfinder application data.
  SecretsDriver:
    Type: String
    Default: local
    AllowedValues:
      - local
      - secrets-manager
    Description: Runtime secrets driver. Keep local until the Secrets Manager adapter is enabled.
  ProofCoreTableName:
    Type: String
    Default: ""
    Description: Optional dedicated Proof core table name from the Vornan Proof stack.
  ProofCoreTableArn:
    Type: String
    Default: ""
  ProofAuditTableName:
    Type: String
    Default: ""
    Description: Optional dedicated Proof audit table name from the Vornan Proof stack.
  ProofAuditTableArn:
    Type: String
    Default: ""
  ProofOperatorActionQaEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled authenticated operator-only gate for bounded LTL Demo Proof action QA.
  ProofOperatorActionAllowedOrders:
    Type: String
    Default: ""
    AllowedPattern: "^$|^A[0-9]{7,8}(,A[0-9]{7,8}){0,24}$"
    Description: Exact comma-separated LTL Demo orders approved for the bounded operator QA window.
  ProofOperatorActionExpiresAt:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"
    Description: Required bounded ISO timestamp after which operator Proof action execution fails closed.
  ProofAdvancedReviewEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled platform gate for customer-scoped Advanced Proof quantity allocation.
  ProofAssetUploadEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled authenticated operator gate for bounded revised-art uploads.
  ProofAssetUploadAllowedOrders:
    Type: String
    Default: ""
    AllowedPattern: "^$|^A[0-9]{7,8}(,A[0-9]{7,8}){0,24}$"
    Description: Exact comma-separated LTL Demo orders approved for revised-art upload QA.
  ProofAssetUploadExpiresAt:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"
    Description: Required bounded UTC expiry for revised-art upload QA.
  ProofAssetPublicationEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled supervised publication of one cleared Proof asset.
  ProofAssetPublicationAllowedOrders:
    Type: String
    Default: ""
    AllowedPattern: "^$|^A[0-9]{7,8}(,A[0-9]{7,8}){0,24}$"
    Description: Exact comma-separated orders approved for supervised Proof publication.
  ProofAssetPublicationExpiresAt:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"
    Description: Required bounded UTC expiry for supervised Proof publication.
  ProofAssetDeliveryBaseUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://go\\.vornan\\.co$"
    Description: Exact direct-200 Proof asset delivery origin; keep empty while publication is dark.
  ProofAssetBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^vornan-pathfinder-proof-assets-[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Existing private Proof asset bucket; no bucket is created by the API stack.
  ProofAssetBucketArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:s3:::vornan-pathfinder-proof-assets-[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  ProofAssetScanWorkerEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Default-disabled worker for sanitized GuardDuty Proof asset scan results.
      This does not enable uploads, public delivery, publication, or Lift writes.
  ProofAssetScanWorkerAllowedObjectKey:
    Type: String
    Default: ""
    AllowedPattern: "^$|^orders/A[0-9]{7,8}/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,255}/revisions/prevision_[a-f0-9]{64}/source/passet_[a-f0-9]{64}/[A-Za-z0-9][A-Za-z0-9._() -]{0,239}$"
    Description: Exact single Proof source-object key approved for a bounded scan-worker QA window.
  ProofAssetScanWorkerExpiresAt:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"
    Description: Required bounded UTC expiry for the exact-object scan-worker QA window.
  ProofGrantCreationEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ProofLtlDemoQaEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled isolated LTL Demo Proof QA profile.
  ProofLtlDemoQaAllowedOrders:
    Type: String
    Default: ""
    AllowedPattern: "^$|^LTL_DEMO_ALL$|^A[0-9]{7,8}(,A[0-9]{7,8}){0,24}$"
    Description: Exact demo orders available to the unified customer Proof QA profile.
  ProofLtlDemoQaExpiresAt:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"
    Description: Shared bounded UTC expiry for the LTL Demo QA profile.
  ProofLtlDemoQaPersistentEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Persistent LTL Demo 1249-only customer QA lane; all other customer and broad capability boundaries remain disabled.
  ProofLtlDemoQaGrantCreationEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled authenticated review-grant creation for the exact LTL Demo QA profile.
  ProofLtlDemoQaSessionReadEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled token-authenticated session read for the exact LTL Demo QA profile.
  ProofLtlDemoQaCustomerApprovalEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled Simple customer approval for the exact LTL Demo QA profile.
  ProofLtlDemoQaRevisionUploadEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled private revised-art upload for the exact LTL Demo QA profile.
  ProofPublicReadEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled public Proof session read boundary.
  ProofCustomerApprovalEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled single-current-proof customer approval boundary.
  ProofCustomerRevisionUploadEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default-disabled customer revised-art upload and finalization boundary. This does not publish an asset or call Lift.
  ProofGrantAllowedCustomerIds:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{1,20}(,[0-9]{1,20}){0,19}$"
    Description: Comma-separated Lift customer IDs eligible for authenticated view-only grant creation.
  ProofReadOnlyActivationExpiresAt:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"
    Description: UTC deadline after which grant creation, token exchange, and sessions fail closed.
  ProofLinkEmailEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ProofPublicBaseUrl:
    Type: String
    Default: "https://proof.vornan.co"
    Description: Public origin used only when producing a one-time Proof fragment link.

Rules:
  WrikeScheduledIntakeRequiresPreparedEvidence:
    RuleCondition: !Equals [!Ref WrikeScheduledIntakeEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref WrikeScheduledIntakeCustomerId, ""]]
        AssertDescription: Scheduled Wrike intake requires one exact Pathfinder customer.
      - Assert: !Not [!Equals [!Ref WrikeScheduledIntakeImportMethodId, ""]]
        AssertDescription: Scheduled Wrike intake requires one exact saved Import Method.
      - Assert: !Equals [!Ref WrikeWorkbookEvidenceEnabled, "true"]
        AssertDescription: Scheduled Wrike intake requires immutable source evidence capture.
      - Assert: !Equals [!Ref WrikeEvidencePreviewEnabled, "true"]
        AssertDescription: Scheduled Wrike intake requires preview job creation.
      - Assert: !Equals [!Ref WrikeLiftDocumentPublicationEnabled, "true"]
        AssertDescription: Scheduled Wrike intake requires direct Lift document publication.
  WrikeScheduledStatusWritebackRequiresScheduler:
    RuleCondition: !Equals [!Ref WrikeScheduledStatusWritebackEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref WrikeScheduledIntakeEnabled, "true"]
        AssertDescription: Automatic Wrike status writeback requires scheduled intake.
  WrikeScheduledLiftSubmitRequiresLiveBoundary:
    RuleCondition: !Equals [!Ref WrikeScheduledLiftSubmitEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref WrikeScheduledIntakeEnabled, "true"]
        AssertDescription: Automatic Lift submit requires scheduled Wrike intake.
      - Assert: !Equals [!Ref ExternalLiftSubmitEnabled, "true"]
        AssertDescription: Automatic Lift submit requires the external submit transport gate.
      - Assert: !Equals [!Ref LiftTransportMode, "live"]
        AssertDescription: Automatic Lift submit requires live transport mode.
      - Assert: !Equals [!Ref AllowLiveCustomerSubmit, "true"]
        AssertDescription: Automatic Lift submit requires explicit live-customer submit approval.
  WrikeStatusWritebackRequiresBoundedTask:
    RuleCondition: !Equals [!Ref WrikeStatusWritebackEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref WrikeStatusWritebackTaskId, ""]]
        AssertDescription: Wrike status writeback requires one exact task identifier.
      - Assert: !Not [!Equals [!Ref WrikeStatusWritebackExpiresAt, ""]]
        AssertDescription: Wrike status writeback requires a bounded UTC expiry.
  WrikeLiftDocumentPublicationRequiresBoundary:
    RuleCondition: !Equals [!Ref WrikeLiftDocumentPublicationEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref WrikeLiftDocumentDeliveryBucketName, ""]]
        AssertDescription: Wrike Lift document publication requires its dedicated delivery bucket.
      - Assert: !Equals [!Ref WrikeLiftDocumentDeliveryBaseUrl, "https://go.vornan.co"]
        AssertDescription: Wrike Lift document publication requires the exact go.vornan.co origin.
  ProofGrantCreationRequiresBoundedWindow:
    RuleCondition: !Equals [!Ref ProofGrantCreationEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProofReadOnlyActivationExpiresAt, ""]]
        AssertDescription: ProofReadOnlyActivationExpiresAt must be configured before grant creation can be enabled.
  ProofLinkEmailRequiresGrantCreation:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref ProofLinkEmailEnabled, "false"]
          - !Equals [!Ref ProofGrantCreationEnabled, "true"]
        AssertDescription: Proof link email requires authenticated Proof grant creation to be enabled.
  ProofCustomerApprovalRequiresReviewBoundary:
    RuleCondition: !Equals [!Ref ProofCustomerApprovalEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref ProofPublicReadEnabled, "true"]
        AssertDescription: Customer Proof approval requires public Proof sessions.
      - Assert: !Equals [!Ref ProofGrantCreationEnabled, "true"]
        AssertDescription: Customer Proof approval requires authenticated review-grant creation.
      - Assert: !And
          - !Not [!Equals [!Ref ProofCoreTableName, ""]]
          - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
          - !Not [!Equals [!Ref ProofAuditTableName, ""]]
          - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
        AssertDescription: Customer Proof approval requires the dedicated Proof core and audit tables.
      - Assert: !Not [!Equals [!Ref ProofReadOnlyActivationExpiresAt, ""]]
        AssertDescription: Customer Proof approval requires a bounded activation deadline.
  ProofCustomerRevisionUploadRequiresReviewBoundary:
    RuleCondition: !Equals [!Ref ProofCustomerRevisionUploadEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref ProofPublicReadEnabled, "true"]
        AssertDescription: Customer revised-art upload requires public Proof sessions.
      - Assert: !Equals [!Ref ProofAssetUploadEnabled, "true"]
        AssertDescription: Customer revised-art upload requires the bounded private asset upload capability.
      - Assert: !And
          - !Not [!Equals [!Ref ProofCoreTableName, ""]]
          - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
          - !Not [!Equals [!Ref ProofAuditTableName, ""]]
          - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
        AssertDescription: Customer revised-art upload requires the dedicated Proof core and audit tables.
      - Assert: !Not [!Equals [!Ref ProofReadOnlyActivationExpiresAt, ""]]
        AssertDescription: Customer revised-art upload requires a bounded review-session deadline.
  ProofLtlDemoQaRequiresIsolatedBoundary:
    RuleCondition: !Equals [!Ref ProofLtlDemoQaEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProofLtlDemoQaAllowedOrders, ""]]
        AssertDescription: LTL Demo Proof QA requires exact allowlisted demo orders.
      - Assert: !Or
          - !Equals [!Ref ProofLtlDemoQaPersistentEnabled, "true"]
          - !Not [!Equals [!Ref ProofLtlDemoQaExpiresAt, ""]]
        AssertDescription: LTL Demo Proof QA requires a persistent LTL-only lane or one bounded UTC expiry.
      - Assert: !And
          - !Not [!Equals [!Ref ProofCoreTableName, ""]]
          - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
          - !Not [!Equals [!Ref ProofAuditTableName, ""]]
          - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
        AssertDescription: LTL Demo Proof QA requires dedicated Proof core and audit tables.
      - Assert: !Equals [!Ref ProofGrantCreationEnabled, "false"]
        AssertDescription: The profile cannot overlap legacy grant creation.
      - Assert: !Equals [!Ref ProofPublicReadEnabled, "false"]
        AssertDescription: The API-side profile does not expose public Proof reads.
      - Assert: !Equals [!Ref ProofCustomerApprovalEnabled, "false"]
        AssertDescription: The profile cannot overlap legacy customer approval.
      - Assert: !Equals [!Ref ProofCustomerRevisionUploadEnabled, "false"]
        AssertDescription: The API-side profile does not accept customer uploads.
      - Assert: !Equals [!Ref ProofAssetUploadEnabled, "false"]
        AssertDescription: The API-side profile does not activate asset upload.
      - Assert: !Equals [!Ref ProofAssetPublicationEnabled, "false"]
        AssertDescription: The profile never activates asset publication.
      - Assert: !Equals [!Ref ProofAssetScanWorkerEnabled, "false"]
        AssertDescription: The profile never activates scan processing.
      - Assert: !Equals [!Ref ProofOperatorActionQaEnabled, "false"]
        AssertDescription: The profile never activates Lift actions.
      - Assert: !Equals [!Ref ProofLinkEmailEnabled, "false"]
        AssertDescription: The profile never sends Proof email.
  ProofLtlDemoQaSessionReadRequiresGrantCreation:
    RuleCondition: !Equals [!Ref ProofLtlDemoQaSessionReadEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref ProofLtlDemoQaEnabled, "true"]
        AssertDescription: LTL Demo session read requires the exact QA profile.
      - Assert: !Equals [!Ref ProofLtlDemoQaGrantCreationEnabled, "true"]
        AssertDescription: LTL Demo session read requires authenticated grant creation.
  ProofLtlDemoQaCustomerApprovalRequiresSessionRead:
    RuleCondition: !Equals [!Ref ProofLtlDemoQaCustomerApprovalEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref ProofLtlDemoQaEnabled, "true"]
        AssertDescription: LTL Demo customer approval requires the exact QA profile.
      - Assert: !Equals [!Ref ProofLtlDemoQaSessionReadEnabled, "true"]
        AssertDescription: LTL Demo customer approval requires token-authenticated session read.
  ProofLtlDemoQaRevisionUploadRequiresSessionRead:
    RuleCondition: !Equals [!Ref ProofLtlDemoQaRevisionUploadEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref ProofLtlDemoQaEnabled, "true"]
        AssertDescription: LTL Demo revised-art upload requires the exact QA profile.
      - Assert: !Equals [!Ref ProofLtlDemoQaSessionReadEnabled, "true"]
        AssertDescription: LTL Demo revised-art upload requires token-authenticated session read.
  ProofOperatorActionRequiresDurableIsolation:
    RuleCondition: !Equals [!Ref ProofOperatorActionQaEnabled, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref ProofCoreTableName, ""]]
          - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
          - !Not [!Equals [!Ref ProofAuditTableName, ""]]
          - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
        AssertDescription: Operator Proof action QA requires the dedicated Proof core and audit table names and ARNs.
      - Assert: !Not [!Equals [!Ref ProofOperatorActionAllowedOrders, ""]]
        AssertDescription: Operator Proof action QA requires an exact nonempty order allowlist.
      - Assert: !Not [!Equals [!Ref ProofOperatorActionExpiresAt, ""]]
        AssertDescription: Operator Proof action QA requires a bounded UTC expiry.
      - Assert: !Equals [!Ref ProofGrantCreationEnabled, "false"]
        AssertDescription: Operator Proof action QA cannot be combined with customer grant creation.
      - Assert: !Equals [!Ref ProofLinkEmailEnabled, "false"]
        AssertDescription: Operator Proof action QA cannot be combined with Proof link email delivery.
  ProofAdvancedReviewRequiresOperatorQa:
    RuleCondition: !Equals [!Ref ProofAdvancedReviewEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref ProofOperatorActionQaEnabled, "true"]
        AssertDescription: Advanced Proof review requires the bounded authenticated operator action gate.
  ProofAssetUploadRequiresDurableIsolation:
    RuleCondition: !Equals [!Ref ProofAssetUploadEnabled, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref ProofCoreTableName, ""]]
          - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
          - !Not [!Equals [!Ref ProofAuditTableName, ""]]
          - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
        AssertDescription: Proof asset upload requires the dedicated Proof core and audit tables.
      - Assert: !And
          - !Not [!Equals [!Ref ProofAssetBucketName, ""]]
          - !Not [!Equals [!Ref ProofAssetBucketArn, ""]]
        AssertDescription: Proof asset upload requires the exact existing private bucket name and ARN.
      - Assert: !Not [!Equals [!Ref ProofAssetUploadAllowedOrders, ""]]
        AssertDescription: Proof asset upload requires an exact nonempty order allowlist.
      - Assert: !Not [!Equals [!Ref ProofAssetUploadExpiresAt, ""]]
        AssertDescription: Proof asset upload requires a bounded UTC expiry.
      - Assert: !Equals [!Ref ProofGrantCreationEnabled, "false"]
        AssertDescription: Operator asset upload cannot be combined with customer grant creation.
      - Assert: !Equals [!Ref ProofLinkEmailEnabled, "false"]
        AssertDescription: Operator asset upload cannot be combined with Proof link email delivery.
  ProofAssetPublicationRequiresDurableIsolation:
    RuleCondition: !Equals [!Ref ProofAssetPublicationEnabled, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref ProofCoreTableName, ""]]
          - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
          - !Not [!Equals [!Ref ProofAuditTableName, ""]]
          - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
          - !Not [!Equals [!Ref ProofAssetBucketName, ""]]
          - !Not [!Equals [!Ref ProofAssetBucketArn, ""]]
        AssertDescription: Proof publication requires exact durable table and private bucket bindings.
      - Assert: !Not [!Equals [!Ref ProofAssetPublicationAllowedOrders, ""]]
        AssertDescription: Proof publication requires an exact nonempty order allowlist.
      - Assert: !Not [!Equals [!Ref ProofAssetPublicationExpiresAt, ""]]
        AssertDescription: Proof publication requires a bounded UTC expiry.
      - Assert: !Equals [!Ref ProofAssetDeliveryBaseUrl, "https://go.vornan.co"]
        AssertDescription: Proof publication requires the direct go.vornan.co delivery origin.
      - Assert: !Equals [!Ref ProofGrantCreationEnabled, "false"]
        AssertDescription: Proof publication cannot overlap grant creation.
      - Assert: !Equals [!Ref ProofLinkEmailEnabled, "false"]
        AssertDescription: Proof publication cannot overlap Proof email.
  ProofAssetScanWorkerRequiresDurableIsolation:
    RuleCondition: !Equals [!Ref ProofAssetScanWorkerEnabled, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref ProofCoreTableName, ""]]
          - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
          - !Not [!Equals [!Ref ProofAuditTableName, ""]]
          - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
        AssertDescription: Proof asset scan processing requires the dedicated Proof core and audit tables.
      - Assert: !And
          - !Not [!Equals [!Ref ProofAssetBucketName, ""]]
          - !Not [!Equals [!Ref ProofAssetBucketArn, ""]]
        AssertDescription: Proof asset scan processing requires the exact existing private bucket.
      - Assert: !Not [!Equals [!Ref ProofAssetScanWorkerAllowedObjectKey, ""]]
        AssertDescription: Proof asset scan processing requires one exact source-object key.
      - Assert: !Not [!Equals [!Ref ProofAssetScanWorkerExpiresAt, ""]]
        AssertDescription: Proof asset scan processing requires a bounded UTC expiry.
      - Assert: !Equals [!Ref ProofGrantCreationEnabled, "false"]
        AssertDescription: Proof asset scan processing cannot be combined with customer grant creation.
      - Assert: !Equals [!Ref ProofLinkEmailEnabled, "false"]
        AssertDescription: Proof asset scan processing cannot be combined with Proof link email delivery.
  ProofTablesMustBeConfiguredTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref ProofCoreTableName, ""]
            - !Equals [!Ref ProofAuditTableName, ""]
          - !And
            - !Not [!Equals [!Ref ProofCoreTableName, ""]]
            - !Not [!Equals [!Ref ProofAuditTableName, ""]]
        AssertDescription: ProofCoreTableName and ProofAuditTableName must be configured together.
      - Assert: !Or
          - !And
            - !Equals [!Ref ProofCoreTableArn, ""]
            - !Equals [!Ref ProofAuditTableArn, ""]
          - !And
            - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
            - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
        AssertDescription: ProofCoreTableArn and ProofAuditTableArn must be configured together.
      - Assert: !Or
          - !And
            - !Equals [!Ref ProofCoreTableName, ""]
            - !Equals [!Ref ProofCoreTableArn, ""]
          - !And
            - !Not [!Equals [!Ref ProofCoreTableName, ""]]
            - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
        AssertDescription: Proof core table name and ARN must either both be present or both be absent.

Conditions:
  WrikeScheduledIntakeActive: !Equals [!Ref WrikeScheduledIntakeEnabled, "true"]
  WrikeCustomFieldDiscoveryActive: !Equals [!Ref WrikeCustomFieldDiscoveryEnabled, "true"]
  WrikeDiscoveryPreviewActive: !Equals [!Ref WrikeDiscoveryPreviewEnabled, "true"]
  WrikeManualIntakeActive: !Equals [!Ref WrikeManualIntakeEnabled, "true"]
  WrikeOrderRehearsalActive: !Equals [!Ref WrikeOrderRehearsalEnabled, "true"]
  PublicStatusReturnLinkActive: !Equals [!Ref PublicStatusReturnLink, "true"]
  PublicStatusDebugReturnLinkActive: !Equals [!Ref PublicStatusEmailDebugReturnLink, "true"]
  PublicIntakeEmailVerificationActive: !Equals [!Ref PublicIntakeEmailVerificationEnabled, "true"]
  HasApiCustomDomain: !And
    - !Not [!Equals [!Ref ApiDomainName, ""]]
    - !Not [!Equals [!Ref ApiCertificateArn, ""]]
  HasProofCoreTable: !And
    - !Not [!Equals [!Ref ProofCoreTableName, ""]]
    - !Not [!Equals [!Ref ProofCoreTableArn, ""]]
  HasProofAuditTable: !And
    - !Not [!Equals [!Ref ProofAuditTableName, ""]]
    - !Not [!Equals [!Ref ProofAuditTableArn, ""]]
  HasProofTables: !And
    - !Condition HasProofCoreTable
    - !Condition HasProofAuditTable
  HasProofAssetBucket: !And
    - !Not [!Equals [!Ref ProofAssetBucketName, ""]]
    - !Not [!Equals [!Ref ProofAssetBucketArn, ""]]
  HasProofAssetScanWorkerBoundary: !And
    - !Condition HasProofTables
    - !Condition HasProofAssetBucket
  ProofLtlDemoQaRevisionUploadActive: !And
    - !Equals [!Ref ProofLtlDemoQaEnabled, "true"]
    - !Equals [!Ref ProofLtlDemoQaRevisionUploadEnabled, "true"]
  ProofAssetUploadActive: !And
    - !Condition HasProofAssetBucket
    - !Or
      - !Equals [!Ref ProofAssetUploadEnabled, "true"]
      - !Condition ProofLtlDemoQaRevisionUploadActive
  ProofAssetPublicationActive: !And
    - !Condition HasProofAssetBucket
    - !Condition HasProofTables
    - !Equals [!Ref ProofAssetPublicationEnabled, "true"]
  ProofAssetScanWorkerActive: !And
    - !Condition HasProofAssetScanWorkerBoundary
    - !Equals [!Ref ProofAssetScanWorkerEnabled, "true"]
  HasWrikeLiftDocumentDeliveryBucket: !Not [!Equals [!Ref WrikeLiftDocumentDeliveryBucketName, ""]]

Resources:
  PathfinderSourceEvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "vornan-pathfinder-source-evidence-${EnvironmentName}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: App
          Value: Pathfinder
        - Key: Environment
          Value: !Ref EnvironmentName

  PathfinderSourceEvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PathfinderSourceEvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt PathfinderSourceEvidenceBucket.Arn
              - !Sub "${PathfinderSourceEvidenceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ProofAssetScanWorkerDeadLetterQueue:
    Condition: HasProofAssetScanWorkerBoundary
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${LambdaFunctionName}-${EnvironmentName}-proof-asset-scan-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ProofAssetScanWorkerQueue:
    Condition: HasProofAssetScanWorkerBoundary
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${LambdaFunctionName}-${EnvironmentName}-proof-asset-scan"
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProofAssetScanWorkerDeadLetterQueue.Arn
        maxReceiveCount: 3

  ProofAssetScanWorkerRole:
    Condition: HasProofAssetScanWorkerBoundary
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3037
    Properties:
      RoleName: !Sub "${LambdaFunctionName}-${EnvironmentName}-proof-asset-scan-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: proof-asset-scan-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt ProofAssetScanWorkerQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Ref ProofCoreTableArn
                  - !Ref ProofAuditTableArn
              - Effect: Allow
                Action:
                  - dynamodb:TransactWriteItems
                  # DynamoDB evaluates the two conditional Put actions in the
                  # scan transition against their underlying item permissions.
                  # Keep these scoped to the two durable Proof tables only.
                  - dynamodb:PutItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Ref ProofCoreTableArn
                  - !Ref ProofAuditTableArn
              - Effect: Allow
                Action:
                  - s3:GetObjectVersionTagging
                  - s3:PutObjectVersionTagging
                Resource: !Sub "${ProofAssetBucketArn}/orders/*"

  ProofAssetScanWorkerFunction:
    Condition: HasProofAssetScanWorkerBoundary
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${LambdaFunctionName}-${EnvironmentName}-proof-asset-scan"
      Description: Default-dark worker for sanitized GuardDuty Proof asset scan observations.
      Runtime: nodejs22.x
      Handler: proof-asset-scan-worker-lambda.handler
      Role: !GetAtt ProofAssetScanWorkerRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          NODE_OPTIONS: "--enable-source-maps"
          PATHFINDER_PROOF_ENVIRONMENT_NAME: !Ref EnvironmentName
          PATHFINDER_PROOF_STORAGE_DRIVER: dynamodb
          PATHFINDER_PROOF_CORE_TABLE: !Ref ProofCoreTableName
          PATHFINDER_PROOF_AUDIT_TABLE: !Ref ProofAuditTableName
          PATHFINDER_PROOF_ASSET_BUCKET: !Ref ProofAssetBucketName
          PATHFINDER_PROOF_ASSET_SCAN_ACCOUNT_ID: !Ref AWS::AccountId
          PATHFINDER_PROOF_ASSET_SCAN_REGION: !Ref AWS::Region
          PATHFINDER_ENABLE_PROOF_ASSET_SCAN_WORKER: !If
            - ProofAssetScanWorkerActive
            - "true"
            - "false"
          PATHFINDER_PROOF_ASSET_SCAN_WORKER_ALLOWED_OBJECT_KEY: !If
            - ProofAssetScanWorkerActive
            - !Ref ProofAssetScanWorkerAllowedObjectKey
            - ""
          PATHFINDER_PROOF_ASSET_SCAN_WORKER_EXPIRES_AT: !If
            - ProofAssetScanWorkerActive
            - !Ref ProofAssetScanWorkerExpiresAt
            - ""

  ProofAssetScanWorkerEventSource:
    Condition: ProofAssetScanWorkerActive
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      Enabled: true
      EventSourceArn: !GetAtt ProofAssetScanWorkerQueue.Arn
      FunctionName: !Ref ProofAssetScanWorkerFunction
      FunctionResponseTypes:
        - ReportBatchItemFailures

  ProofAssetScanEventRule:
    Condition: ProofAssetScanWorkerActive
    Type: AWS::Events::Rule
    Properties:
      Description: Sanitizes exact GuardDuty Proof asset scan results before queueing.
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Malware Protection Object Scan Result
        account:
          - !Ref AWS::AccountId
        region:
          - !Ref AWS::Region
        detail:
          schemaVersion:
            - "1.0"
          resourceType:
            - S3_OBJECT
          s3ObjectDetails:
            bucketName:
              - !Ref ProofAssetBucketName
            objectKey:
              - !Ref ProofAssetScanWorkerAllowedObjectKey
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProofAssetScanWorkerQueue.Arn
          Id: ProofAssetScanQueue
          InputTransformer:
            InputPathsMap:
              account: $.account
              bucket: $.detail.s3ObjectDetails.bucketName
              eventId: $.id
              key: $.detail.s3ObjectDetails.objectKey
              occurredAt: $.time
              region: $.region
              result: $.detail.scanResultDetails.scanResultStatus
              schemaVersion: $.detail.schemaVersion
              versionId: $.detail.s3ObjectDetails.versionId
            InputTemplate: >-
              {"account":<account>,"region":<region>,"observation":{"schema_version":<schemaVersion>,"event_id":<eventId>,"occurred_at":<occurredAt>,"bucket_name":<bucket>,"object_key":<key>,"object_version_id":<versionId>,"scan_result":<result>}}

  ProofAssetScanEventQueuePolicy:
    Condition: ProofAssetScanWorkerActive
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProofAssetScanWorkerQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowExactGuardDutyScanRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProofAssetScanWorkerQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ProofAssetScanEventRule.Arn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ProofAssetScanDeadLetterAlarm:
    Condition: ProofAssetScanWorkerActive
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Proof asset scan observations reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProofAssetScanWorkerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PathfinderApiRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          # SAM CLI 1.152's embedded IAM catalogue omits this valid DynamoDB action.
          ignore_checks:
            - W3037
    Properties:
      RoleName: !Sub "${LambdaFunctionName}-${EnvironmentName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub "${LambdaFunctionName}-${EnvironmentName}-data-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt PathfinderCustomersTable.Arn
                  - !GetAtt PathfinderCustomerWorkspacesTable.Arn
                  - !GetAtt PathfinderTargetsTable.Arn
                  - !GetAtt PathfinderImportMethodsTable.Arn
                  - !GetAtt PathfinderOutputRoutesTable.Arn
                  - !GetAtt PathfinderProductMappingsTable.Arn
                  - !GetAtt PathfinderJobsTable.Arn
                  - !GetAtt PathfinderOrderIdsTable.Arn
                  - !GetAtt PathfinderSubmitAttemptsTable.Arn
                  - !GetAtt PathfinderLiftProductCacheTable.Arn
                  - !GetAtt PathfinderOrderStatusTokensTable.Arn
                  - !GetAtt PathfinderOrderStatusSnapshotsTable.Arn
                  - !GetAtt PathfinderCanonicalRegistryTable.Arn
                  - !If [HasProofCoreTable, !Ref ProofCoreTableArn, !Ref "AWS::NoValue"]
                  - !If [HasProofCoreTable, !Sub "${ProofCoreTableArn}/index/*", !Ref "AWS::NoValue"]
              - !If
                - HasProofAuditTable
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:Query
                  Resource: !Ref ProofAuditTableArn
                - !Ref "AWS::NoValue"
              - !If
                - HasProofTables
                - Effect: Allow
                  Action:
                    - dynamodb:TransactWriteItems
                  Resource:
                    - !Ref ProofCoreTableArn
                    - !Ref ProofAuditTableArn
                - !Ref "AWS::NoValue"
              - !If
                - ProofAssetUploadActive
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectTagging
                    - s3:PutObject
                    - s3:PutObjectTagging
                  Resource: !Sub "${ProofAssetBucketArn}/orders/*"
                - !Ref "AWS::NoValue"
              - !If
                - ProofAssetPublicationActive
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                    - s3:PutObject
                    - s3:PutObjectTagging
                  Resource:
                    - !Sub "${ProofAssetBucketArn}/orders/*"
                    - !Sub "${ProofAssetBucketArn}/a/*"
                - !Ref "AWS::NoValue"
              - !If
                - ProofAssetPublicationActive
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Ref ProofAssetBucketArn
                  Condition:
                    StringLike:
                      s3:prefix: "a/plocator_*"
                - !Ref "AWS::NoValue"
              - Effect: Allow
                Action:
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt PathfinderCustomerWorkspacesTable.Arn
                  - !GetAtt PathfinderProductMappingsTable.Arn
                  - !GetAtt PathfinderJobsTable.Arn
                  - !GetAtt PathfinderOrderIdsTable.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretPrefix}*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  - !Sub "arn:aws:ses:${SesRegion}:${AWS::AccountId}:identity/notify.vornan.co"
                  - !Sub "arn:aws:ses:${SesRegion}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${PathfinderSourceEvidenceBucket.Arn}/wrike/*"
              - !If
                - HasWrikeLiftDocumentDeliveryBucket
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                  Resource:
                    - !Sub "arn:${AWS::Partition}:s3:::${WrikeLiftDocumentDeliveryBucketName}/d/*"
                - !Ref "AWS::NoValue"

  PathfinderApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${LambdaFunctionName}-${EnvironmentName}"
      Description: Pathfinder API Express shell behind API Gateway HTTP API.
      Runtime: nodejs22.x
      Handler: lambda.handler
      Role: !GetAtt PathfinderApiRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          NODE_OPTIONS: "--enable-source-maps"
          PATHFINDER_RUNTIME: "lambda"
          PATHFINDER_CUSTOMER_SEED_FILE: "/var/task/data/lift-customers.sample.csv"
          PATHFINDER_ALLOWED_ORIGINS: !Ref AllowedOrigins
          PATHFINDER_PUBLIC_STATUS_BASE_URL: !Ref PublicStatusBaseUrl
          PATHFINDER_PUBLIC_STATUS_TOKEN_DAYS: !Ref PublicStatusTokenDays
          # Omit inactive, default-false feature flags. The runtime already
          # treats absent values as false, and Lambda limits the complete
          # environment block to 4 KB.
          PATHFINDER_PUBLIC_STATUS_RETURN_LINK: !If [PublicStatusReturnLinkActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_STATUS_EMAIL_MODE: !Ref PublicStatusEmailMode
          PATHFINDER_STATUS_EMAIL_DEBUG_RETURN_LINK: !If [PublicStatusDebugReturnLinkActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_PUBLIC_INTAKE_EMAIL_VERIFICATION_ENABLED: !If [PublicIntakeEmailVerificationActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_ENABLE_WRIKE_CONNECTION_TEST: !Ref WrikeConnectionTestEnabled
          PATHFINDER_ENABLE_WRIKE_CUSTOM_FIELD_DISCOVERY: !If [WrikeCustomFieldDiscoveryActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_ENABLE_WRIKE_DISCOVERY_PREVIEW: !If [WrikeDiscoveryPreviewActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_ENABLE_WRIKE_WORKBOOK_EVIDENCE: !Ref WrikeWorkbookEvidenceEnabled
          PATHFINDER_ENABLE_WRIKE_EVIDENCE_PREVIEW: !Ref WrikeEvidencePreviewEnabled
          PATHFINDER_ENABLE_WRIKE_MANUAL_INTAKE: !If [WrikeManualIntakeActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_WRIKE_SCHEDULED_INTAKE: !Join
            - "|"
            - - !Ref WrikeScheduledIntakeEnabled
              - !Ref WrikeScheduledIntakeCustomerId
              - !Ref WrikeScheduledIntakeImportMethodId
              - !Ref WrikeScheduledIntakeMaxCandidates
              - !Ref WrikeScheduledStatusWritebackEnabled
              - !Ref WrikeScheduledLiftSubmitEnabled
          PATHFINDER_WRIKE_WB: !Join
            - "|"
            - - !Ref WrikeStatusWritebackEnabled
              - !Ref WrikeStatusWritebackTaskId
              - !Ref WrikeStatusWritebackExpiresAt
          PATHFINDER_ENABLE_WRIKE_ORDER_REHEARSAL: !If [WrikeOrderRehearsalActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_WRIKE_ORDER_REHEARSAL_SCOPE: !Join
            - "|"
            - - !Ref WrikeOrderRehearsalCustomerId
              - !Ref WrikeOrderRehearsalImportMethodId
              - !Ref WrikeOrderRehearsalTaskId
              - !Ref WrikeOrderRehearsalExpiresAt
          PATHFINDER_ENABLE_WRIKE_LIFT_DOCUMENT_PUBLICATION: !Ref WrikeLiftDocumentPublicationEnabled
          PATHFINDER_WRIKE_LIFT_DOCUMENT_DELIVERY_BUCKET: !Ref WrikeLiftDocumentDeliveryBucketName
          PATHFINDER_WRIKE_LIFT_DOCUMENT_DELIVERY_BASE_URL: !Ref WrikeLiftDocumentDeliveryBaseUrl
          PATHFINDER_SOURCE_EVIDENCE_BUCKET: !Ref PathfinderSourceEvidenceBucket
          PATHFINDER_WRIKE_OAUTH_REDIRECT_URI: !Ref WrikeOAuthRedirectUri
          PATHFINDER_APP_BASE_URL: !Ref PathfinderAppBaseUrl
          PATHFINDER_EMAIL_FROM: !Ref EmailFrom
          PATHFINDER_STATUS_REPLY_TO: !Ref StatusReplyTo
          PATHFINDER_PROOF_REPLY_TO: !Ref ProofReplyTo
          PATHFINDER_ORDERS_REPLY_TO: !Ref OrdersReplyTo
          PATHFINDER_SYSTEM_REPLY_TO: !Ref SystemReplyTo
          PATHFINDER_SES_REGION: !Ref SesRegion
          PATHFINDER_SES_CONFIGURATION_SET: !Ref SesConfigurationSet
          PATHFINDER_PUBLIC_STATUS_RATE_LIMIT_PEPPER: !Ref PublicStatusRateLimitPepper
          PATHFINDER_PUBLIC_STATUS_EMAIL_MATCH_REQUIRED: !Ref PublicStatusEmailMatchRequired
          PATHFINDER_PUBLIC_STATUS_GLOBAL_ALLOWED_DOMAINS: !Ref PublicStatusGlobalAllowedDomains
          PATHFINDER_REQUIRE_AUTH: !Ref RequireFirebaseAuth
          PATHFINDER_ALLOWED_EMAIL_DOMAINS: !Ref AllowedEmailDomains
          FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
          LIFT_CUSTOMER_LIST_URL: !Ref LiftCustomerListUrl
          LIFT_CUSTOMER_STATUS_URL: !Ref LiftCustomerStatusUrl
          LIFT_PRODUCT_CATALOG_BASE_URL: !Ref LiftProductCatalogBaseUrl
          PATHFINDER_ENABLE_LIFT_SUBMIT: !Ref ExternalLiftSubmitEnabled
          PATHFINDER_LIFT_TRANSPORT_MODE: !Ref LiftTransportMode
          PATHFINDER_ALLOW_LIVE_CUSTOMER_SUBMIT: !Ref AllowLiveCustomerSubmit
          PATHFINDER_STORAGE_DRIVER: !Ref StorageDriver
          PATHFINDER_SECRETS_DRIVER: !Ref SecretsDriver
          PATHFINDER_SECRET_PREFIX: !Ref SecretPrefix
          PATHFINDER_CUSTOMERS_TABLE: !Ref PathfinderCustomersTable
          PATHFINDER_CUSTOMER_WORKSPACES_TABLE: !Ref PathfinderCustomerWorkspacesTable
          PATHFINDER_TARGETS_TABLE: !Ref PathfinderTargetsTable
          PATHFINDER_IMPORT_METHODS_TABLE: !Ref PathfinderImportMethodsTable
          PATHFINDER_OUTPUT_ROUTES_TABLE: !Ref PathfinderOutputRoutesTable
          PATHFINDER_PRODUCT_MAPPINGS_TABLE: !Ref PathfinderProductMappingsTable
          PATHFINDER_JOBS_TABLE: !Ref PathfinderJobsTable
          PATHFINDER_ORDER_IDS_TABLE: !Ref PathfinderOrderIdsTable
          PATHFINDER_SUBMIT_ATTEMPTS_TABLE: !Ref PathfinderSubmitAttemptsTable
          PATHFINDER_LIFT_PRODUCT_CACHE_TABLE: !Ref PathfinderLiftProductCacheTable
          PATHFINDER_ORDER_STATUS_TOKENS_TABLE: !Ref PathfinderOrderStatusTokensTable
          PATHFINDER_ORDER_STATUS_SNAPSHOTS_TABLE: !Ref PathfinderOrderStatusSnapshotsTable
          PATHFINDER_CANONICAL_REGISTRY_TABLE: !Ref PathfinderCanonicalRegistryTable
          PATHFINDER_PROOF_STORAGE_DRIVER: !If [HasProofCoreTable, "dynamodb", "disabled"]
          PATHFINDER_PROOF_CORE_TABLE: !If [HasProofCoreTable, !Ref ProofCoreTableName, !Ref "AWS::NoValue"]
          PATHFINDER_PROOF_AUDIT_TABLE: !If [HasProofAuditTable, !Ref ProofAuditTableName, !Ref "AWS::NoValue"]
          PATHFINDER_PROOF_ENABLE_GRANT_CREATION: !Ref ProofGrantCreationEnabled
          PATHFINDER_PROOF_GRANT_ALLOWED_CUSTOMER_IDS: !Ref ProofGrantAllowedCustomerIds
          PATHFINDER_PROOF_READ_ONLY_ACTIVATION_EXPIRES_AT: !Ref ProofReadOnlyActivationExpiresAt
          PATHFINDER_PROOF_ENABLE_LINK_EMAIL: !Ref ProofLinkEmailEnabled
          PATHFINDER_PROOF_LTL_DEMO_QA_SCOPE: !Join
            - "|"
            - - !Ref ProofLtlDemoQaEnabled
              - !Ref ProofLtlDemoQaExpiresAt
              - !Ref ProofLtlDemoQaAllowedOrders
              - !Ref ProofLtlDemoQaGrantCreationEnabled
              - !Ref ProofLtlDemoQaSessionReadEnabled
              - !Ref ProofLtlDemoQaCustomerApprovalEnabled
              - !Ref ProofLtlDemoQaRevisionUploadEnabled
              - !Ref ProofLtlDemoQaPersistentEnabled
          # Pack the customer-review switches into the existing environment
          # footprint. Lambda limits the complete environment block to 4 KB.
          PATHFINDER_PROOF_CUSTOMER_REVIEW_SCOPE: !Join
            - "|"
            - - !Ref ProofPublicReadEnabled
              - !Ref ProofCustomerApprovalEnabled
              - !Ref ProofCustomerRevisionUploadEnabled
          PATHFINDER_PROOF_PUBLIC_BASE_URL: !Ref ProofPublicBaseUrl
          # Keep the bounded operator controls in one environment entry. Lambda
          # limits the complete environment block to 4 KB; the CloudFormation
          # parameters and rules above remain independently validated.
          PATHFINDER_PROOF_OPERATOR_ACTION_SCOPE: !Join
            - "|"
            - - !Ref ProofOperatorActionQaEnabled
              - !Ref ProofOperatorActionAllowedOrders
              - !Ref ProofOperatorActionExpiresAt
              - !Ref ProofAdvancedReviewEnabled
          # Keep the entire upload configuration out of Lambda's constrained
          # environment unless the bounded upload capability is active. The
          # runtime treats absent values as disabled, and the stack rule above
          # requires the durable tables, bucket, allowlist, and expiry before
          # this condition can become true.
          PATHFINDER_ENABLE_PROOF_ASSET_UPLOAD: !If [ProofAssetUploadActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_PROOF_ASSET_UPLOAD_ALLOWED_ORDERS: !If [ProofLtlDemoQaRevisionUploadActive, !Ref ProofLtlDemoQaAllowedOrders, !If [ProofAssetUploadActive, !Ref ProofAssetUploadAllowedOrders, !Ref "AWS::NoValue"]]
          PATHFINDER_PROOF_ASSET_UPLOAD_EXPIRES_AT: !If [ProofLtlDemoQaRevisionUploadActive, !Ref ProofLtlDemoQaExpiresAt, !If [ProofAssetUploadActive, !Ref ProofAssetUploadExpiresAt, !Ref "AWS::NoValue"]]
          PATHFINDER_ENABLE_PROOF_ASSET_PUBLICATION: !If [ProofAssetPublicationActive, "true", !Ref "AWS::NoValue"]
          PATHFINDER_PROOF_ASSET_PUBLICATION_ALLOWED_ORDERS: !If [ProofAssetPublicationActive, !Ref ProofAssetPublicationAllowedOrders, !Ref "AWS::NoValue"]
          PATHFINDER_PROOF_ASSET_PUBLICATION_EXPIRES_AT: !If [ProofAssetPublicationActive, !Ref ProofAssetPublicationExpiresAt, !Ref "AWS::NoValue"]
          PATHFINDER_PROOF_ASSET_DELIVERY_BASE_URL: !If [ProofAssetPublicationActive, !Ref ProofAssetDeliveryBaseUrl, !Ref "AWS::NoValue"]
          PATHFINDER_PROOF_ASSET_BUCKET: !If
            - ProofAssetPublicationActive
            - !Ref ProofAssetBucketName
            - !If [ProofAssetUploadActive, !Ref ProofAssetBucketName, !Ref "AWS::NoValue"]

  WrikeScheduledIntakeRule:
    Condition: WrikeScheduledIntakeActive
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${LambdaFunctionName}-${EnvironmentName}-wrike-scheduled-intake"
      Description: Prepares independent Pathfinder preview jobs from eligible Wrike Placard Order tasks every 15 minutes.
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt PathfinderApiFunction.Arn
          Id: PathfinderWrikeScheduledIntake
          Input: '{"source":"pathfinder.wrike","detail-type":"Wrike Scheduled Intake","detail":{"automation":"discover_prepare_submit_writeback"}}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 300
            MaximumRetryAttempts: 0

  WrikeScheduledIntakeAsyncPolicy:
    Condition: WrikeScheduledIntakeActive
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref PathfinderApiFunction
      Qualifier: $LATEST
      MaximumEventAgeInSeconds: 300
      MaximumRetryAttempts: 0

  WrikeScheduledIntakeInvokePermission:
    Condition: WrikeScheduledIntakeActive
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PathfinderApiFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WrikeScheduledIntakeRule.Arn

  PathfinderApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${LambdaFunctionName}-${EnvironmentName}-errors"
      AlarmDescription: Pathfinder API Lambda reported one or more errors in five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PathfinderApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PathfinderApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${LambdaFunctionName}-${EnvironmentName}-throttles"
      AlarmDescription: Pathfinder API Lambda was throttled one or more times in five minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref PathfinderApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  WrikeScheduledIntakeFailedInvocationsAlarm:
    Condition: WrikeScheduledIntakeActive
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${LambdaFunctionName}-${EnvironmentName}-wrike-scheduled-failed-invocations"
      AlarmDescription: The scheduled Wrike intake rule failed to invoke Pathfinder.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref WrikeScheduledIntakeRule
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  WrikeScheduledCandidateFailuresAlarm:
    Condition: WrikeScheduledIntakeActive
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${LambdaFunctionName}-${EnvironmentName}-wrike-scheduled-candidate-failures"
      AlarmDescription: One or more Wrike preparation, Lift submit, or Wrike status-comment candidates failed inside a completed scheduler cycle.
      Namespace: Pathfinder/WrikeScheduledIntake
      MetricName: candidate_failures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  WrikeScheduledSubmissionInhibitedAlarm:
    Condition: WrikeScheduledIntakeActive
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${LambdaFunctionName}-${EnvironmentName}-wrike-scheduled-submission-inhibited"
      AlarmDescription: Scheduled intake is running while exact scoped Ready jobs are blocked because scheduled Lift submission is disabled.
      Namespace: Pathfinder/WrikeScheduledIntake
      MetricName: submission_inhibited_ready
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

