AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Private, fail-closed Vornan asset-delivery edge. Proof uploads and Wrike Lift
  source documents use physically separate buckets and path namespaces. This
  stack intentionally contains no upload API, signer, resolver, application
  runtime role, DNS record, or Lift integration. An optional GuardDuty service
  role and malware-protection plan remain disabled by default.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - dev
      - qa
      - prod
    Default: dev
  AssetBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^vornan-pathfinder-proof-assets-[a-z0-9-]+$"
    Description: Optional explicit private bucket name.
  WrikeDeliveryBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^vornan-pathfinder-wrike-delivery-[a-z0-9-]+$"
    Description: Optional explicit bucket for short-lived Wrike documents delivered to Lift.
  WrikeDocumentDeliveryEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Default-dark serving gate for direct /d/* Wrike document delivery. Once
      an immutable URL has been issued, keep this enabled until every issued
      document has expired or been explicitly retired. This is independent of
      the API gate that permits creation of new publications.
  AssetDomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$"
    Description: Future delivery alias. Keep empty for the dark foundation.
  CertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:[0-9]{12}:certificate/[0-9a-fA-F-]+$"
    Description: Future us-east-1 ACM certificate. Keep empty for the dark foundation.
  RetainedSourceDays:
    Type: Number
    Default: 90
    MinValue: 60
    MaxValue: 90
    Description: >
      Cleanup eligibility window for retained source assets. A future guarded
      cleanup worker, not an unconditional S3 lifecycle rule, enforces this value.
  OutboundCopyDays:
    Type: Number
    Default: 14
    MinValue: 14
    MaxValue: 14
  ProofPacketDays:
    Type: Number
    Default: 30
    MinValue: 30
    MaxValue: 30
  UnfinalizedUploadDays:
    Type: Number
    Default: 7
    MinValue: 7
    MaxValue: 7
  IncompleteMultipartDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 1
  ProofAssetMalwareProtectionEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Default-dark GuardDuty Malware Protection for S3 plan. When enabled, it
      scans only newly uploaded objects under orders/ and applies the managed
      GuardDutyMalwareScanStatus result tag.

Rules:
  AssetAliasPair:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Equals:
                    - Ref: AssetDomainName
                    - ""
                - Fn::Equals:
                    - Ref: CertificateArn
                    - ""
            - Fn::And:
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: AssetDomainName
                        - ""
                - Fn::Not:
                    - Fn::Equals:
                        - Ref: CertificateArn
                        - ""
        AssertDescription: AssetDomainName and CertificateArn must be supplied together.
  ProductionAssetAlias:
    RuleCondition:
      Fn::Equals:
        - Ref: EnvironmentName
        - prod
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Equals:
                - Ref: AssetDomainName
                - ""
            - Fn::Equals:
                - Ref: AssetDomainName
                - go.vornan.co
        AssertDescription: The production asset alias, when configured, must be go.vornan.co.
  WrikeDeliveryRequiresAlias:
    RuleCondition:
      Fn::Equals:
        - Ref: WrikeDocumentDeliveryEnabled
        - "true"
    Assertions:
      - Assert:
          Fn::Equals:
            - Ref: AssetDomainName
            - go.vornan.co
        AssertDescription: Wrike document delivery requires the exact go.vornan.co alias.
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: CertificateArn
                - ""
        AssertDescription: Wrike document delivery requires the reviewed us-east-1 certificate.
  MalwareProtectionDevOnly:
    RuleCondition:
      Fn::Equals:
        - Ref: ProofAssetMalwareProtectionEnabled
        - "true"
    Assertions:
      - Assert:
          Fn::Equals:
            - Ref: EnvironmentName
            - dev
        AssertDescription: Proof asset malware protection may be activated only in dev.

Conditions:
  HasExplicitBucketName: !Not [!Equals [!Ref AssetBucketName, ""]]
  HasExplicitWrikeDeliveryBucketName: !Not [!Equals [!Ref WrikeDeliveryBucketName, ""]]
  HasAssetAlias: !Not [!Equals [!Ref AssetDomainName, ""]]
  WrikeDocumentDeliveryActive: !Equals [!Ref WrikeDocumentDeliveryEnabled, "true"]
  GuardDutyMalwareProtectionActive: !Equals [!Ref ProofAssetMalwareProtectionEnabled, "true"]

Resources:
  ProofAssetBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasExplicitBucketName
        - !Ref AssetBucketName
        - !Sub vornan-pathfinder-proof-assets-${EnvironmentName}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - POST
            AllowedOrigins:
              - https://pathfinder.vornan.co
              - http://127.0.0.1:5183
              - http://localhost:5183
            ExposedHeaders:
              - ETag
              - x-amz-version-id
              - x-amz-checksum-sha256
            MaxAge: 600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: !Ref IncompleteMultipartDays
          - Id: ExpireUnfinalizedUploads
            Status: Enabled
            TagFilters:
              - Key: proof-lifecycle
                Value: unfinalized
            ExpirationInDays: !Ref UnfinalizedUploadDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref UnfinalizedUploadDays
          - Id: ExpireQuarantinedUploads
            Status: Enabled
            TagFilters:
              - Key: proof-lifecycle
                Value: quarantined
            ExpirationInDays: !Ref UnfinalizedUploadDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref UnfinalizedUploadDays
          - Id: ExpireLiftOutboundCopies
            Status: Enabled
            TagFilters:
              - Key: proof-lifecycle
                Value: lift-outbound
            ExpirationInDays: !Ref OutboundCopyDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref OutboundCopyDays
          - Id: ExpireProofPackets
            Status: Enabled
            TagFilters:
              - Key: proof-lifecycle
                Value: proof-packet
            ExpirationInDays: !Ref ProofPacketDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref ProofPacketDays
      Tags:
        - Key: Application
          Value: VornanProof
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DataBoundary
          Value: proof-uploads-only

  GuardDutyMalwareProtectionRole:
    Type: AWS::IAM::Role
    Condition: GuardDutyMalwareProtectionActive
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GuardDutyProofAssetMalwareProtection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowManagedRuleToSendS3EventsToGuardDuty
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
                Condition:
                  StringLike:
                    events:ManagedBy: malware-protection-plan.guardduty.amazonaws.com
              - Sid: AllowGuardDutyToMonitorEventBridgeManagedRule
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
              - Sid: AllowPostScanTag
                Effect: Allow
                Action:
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                  - s3:PutObjectVersionTagging
                  - s3:GetObjectVersionTagging
                Resource: !Sub ${ProofAssetBucket.Arn}/orders/*
              - Sid: AllowEnableS3EventBridgeEvents
                Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt ProofAssetBucket.Arn
              - Sid: AllowPutValidationObject
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ProofAssetBucket.Arn}/malware-protection-resource-validation-object
              - Sid: AllowCheckBucketOwnership
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ProofAssetBucket.Arn
              - Sid: AllowMalwareScan
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${ProofAssetBucket.Arn}/orders/*
      Tags:
        - Key: Application
          Value: VornanProof
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Capability
          Value: guardduty-malware-scan-only

  GuardDutyMalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    Condition: GuardDutyMalwareProtectionActive
    Properties:
      Actions:
        Tagging:
          Status: ENABLED
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref ProofAssetBucket
          ObjectPrefixes:
            - orders/
      Role: !GetAtt GuardDutyMalwareProtectionRole.Arn
      Tags:
        - Key: Application
          Value: VornanProof
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Capability
          Value: proof-upload-malware-scan

  WrikeDocumentDeliveryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasExplicitWrikeDeliveryBucketName
        - !Ref WrikeDeliveryBucketName
        - !Sub vornan-pathfinder-wrike-delivery-${EnvironmentName}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireWrikeLiftDocuments
            Status: Enabled
            Prefix: d/
            ExpirationInDays: !Ref OutboundCopyDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref OutboundCopyDays
          - Id: AbortIncompleteWrikeDocumentUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: !Ref IncompleteMultipartDays
      Tags:
        - Key: Application
          Value: Pathfinder
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: DataBoundary
          Value: wrike-lift-delivery-only

  ProofAssetOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub Private OAC for Vornan Proof ${EnvironmentName} assets
        Name: !Sub vornan-proof-assets-${EnvironmentName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ProofAssetDarkFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub vornan-proof-assets-dark-${EnvironmentName}
      AutoPublish: true
      FunctionConfig:
        Comment: Fail closed until the Proof asset resolver and signer are separately approved
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          return {
            statusCode: 404,
            statusDescription: "Not Found",
            headers: {
              "cache-control": { value: "no-store, max-age=0" },
              "content-type": { value: "text/plain; charset=utf-8" },
              "x-content-type-options": { value: "nosniff" }
            },
            body: {
              encoding: "text",
              data: "Not Found"
            }
          };
        }

  WrikeDocumentDeliveryFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub vornan-wrike-documents-${EnvironmentName}
      AutoPublish: true
      FunctionConfig:
        Comment: Default-dark gate for immutable Wrike documents delivered to Lift
        Runtime: cloudfront-js-2.0
      FunctionCode: !If
        - WrikeDocumentDeliveryActive
        - |
          function handler(event) {
            return event.request;
          }
        - |
          function handler(event) {
            return {
              statusCode: 404,
              statusDescription: "Not Found",
              headers: {
                "cache-control": { value: "no-store, max-age=0" },
                "content-type": { value: "text/plain; charset=utf-8" },
                "x-content-type-options": { value: "nosniff" }
              },
              body: {
                encoding: "text",
                data: "Not Found"
              }
            };
          }

  ProofAssetResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub vornan-proof-assets-security-${EnvironmentName}
        Comment: Security headers for the private Vornan Proof asset boundary
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: no-store, max-age=0
              Override: true

  ProofAssetDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - HasAssetAlias
          - - !Ref AssetDomainName
          - !Ref AWS::NoValue
        Comment: !Sub Fail-closed Vornan Proof ${EnvironmentName} asset delivery boundary
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ProofAssetDarkFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref ProofAssetResponseHeadersPolicy
          TargetOriginId: proof-assets
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          - AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WrikeDocumentDeliveryFunction.FunctionARN
            PathPattern: d/*
            ResponseHeadersPolicyId: !Ref ProofAssetResponseHeadersPolicy
            TargetOriginId: wrike-lift-documents
            ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt ProofAssetBucket.RegionalDomainName
            Id: proof-assets
            OriginAccessControlId: !Ref ProofAssetOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - DomainName: !GetAtt WrikeDocumentDeliveryBucket.RegionalDomainName
            Id: wrike-lift-documents
            OriginAccessControlId: !Ref ProofAssetOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasAssetAlias
          - AcmCertificateArn: !Ref CertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
            MinimumProtocolVersion: TLSv1
      Tags:
        - Key: Application
          Value: VornanProof
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Capability
          Value: dark-asset-foundation

  ProofAssetBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProofAssetBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ProofAssetBucket.Arn
              - !Sub ${ProofAssetBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowExactCloudFrontDistributionRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${ProofAssetBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ProofAssetDistribution}

  WrikeDocumentDeliveryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WrikeDocumentDeliveryBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WrikeDocumentDeliveryBucket.Arn
              - !Sub ${WrikeDocumentDeliveryBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowExactCloudFrontDistributionRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${WrikeDocumentDeliveryBucket.Arn}/d/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ProofAssetDistribution}

Outputs:
  ProofAssetBucketName:
    Value: !Ref ProofAssetBucket
  ProofAssetBucketArn:
    Value: !GetAtt ProofAssetBucket.Arn
  ProofAssetDistributionId:
    Value: !Ref ProofAssetDistribution
  ProofAssetDistributionDomainName:
    Value: !GetAtt ProofAssetDistribution.DomainName
  ProofAssetOriginAccessControlId:
    Value: !Ref ProofAssetOriginAccessControl
  WrikeDocumentDeliveryBucketName:
    Value: !Ref WrikeDocumentDeliveryBucket
  WrikeDocumentDeliveryBucketArn:
    Value: !GetAtt WrikeDocumentDeliveryBucket.Arn
  WrikeDocumentDeliveryEnabled:
    Value: !If [WrikeDocumentDeliveryActive, "true", "false"]
  ProofAssetAliasConfigured:
    Value: !If [HasAssetAlias, "true", "false"]
  ProofAssetUploadCapabilityEnabled:
    Value: "false"
  ProofAssetDeliveryCapabilityEnabled:
    Value: "false"
  ProofAssetLiftPublicationEnabled:
    Value: "false"
  ProofAssetMalwareProtectionEnabled:
    Value: !If [GuardDutyMalwareProtectionActive, "true", "false"]
  GuardDutyMalwareProtectionPlanId:
    Value: !If
      - GuardDutyMalwareProtectionActive
      - !GetAtt GuardDutyMalwareProtectionPlan.MalwareProtectionPlanId
      - ""
  GuardDutyMalwareProtectionPlanStatus:
    Value: !If
      - GuardDutyMalwareProtectionActive
      - !GetAtt GuardDutyMalwareProtectionPlan.Status
      - "DISABLED"
  GuardDutyMalwareProtectionRoleArn:
    Value: !If
      - GuardDutyMalwareProtectionActive
      - !GetAtt GuardDutyMalwareProtectionRole.Arn
      - ""
  RetainedSourceCleanupEligibilityDays:
    Value: !Ref RetainedSourceDays
